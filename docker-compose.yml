services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veloura_cove
      POSTGRES_USER: ${DB_USERNAME:-veloura}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-veloura}
    ports:
      - "5433:5432"
    volumes:
      - veloura-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  veloura-postgres-data:
