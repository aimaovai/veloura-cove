spring:
  application:
    name: veloura-cove-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/veloura_cove}
    username: ${DB_USERNAME:veloura}
    password: ${DB_PASSWORD:veloura}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
server:
  error:
    include-message: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
